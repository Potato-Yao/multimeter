name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: multimeter-linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            artifact: multimeter-windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build release executable
        run: cargo build --locked --release

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/multimeter-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release multimeter

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path target/release/multimeter.exe `
            -DestinationPath "dist/multimeter-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          pattern: multimeter-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
