name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 GNU
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cargo_args: --no-default-features
            asset_suffix: ""
            artifact_name: multimeter-x86_64-unknown-linux-gnu
          - name: Linux x86_64 musl
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            cargo_args: --no-default-features
            asset_suffix: ""
            artifact_name: multimeter-x86_64-unknown-linux-musl
          - name: Windows x86_64 self-contained
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo_args: --features static-dxc
            asset_suffix: ""
            artifact_name: multimeter-x86_64-pc-windows-msvc
          - name: Windows x86_64 no static DXC
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo_args: --no-default-features
            asset_suffix: -no-static-dxc
            artifact_name: multimeter-x86_64-pc-windows-msvc-no-static-dxc
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            cargo_args: --no-default-features
            asset_suffix: ""
            artifact_name: multimeter-aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Run tests
        run: cargo test --locked --all-targets --target "${{ matrix.target }}" ${{ matrix.cargo_args }}

      - name: Build release executable
        run: cargo build --locked --release --target "${{ matrix.target }}" ${{ matrix.cargo_args }}

      - name: Smoke-test Linux executable
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: ./target/"${TARGET}"/release/multimeter --help

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: '& "target/$env:TARGET/release/multimeter.exe" --help'

      - name: Copy Linux executable
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          mkdir -p dist
          install -m 755 \
            "target/${TARGET}/release/multimeter" \
            "dist/multimeter-${GITHUB_REF_NAME}-${TARGET}${ASSET_SUFFIX}"

      - name: Copy Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item `
            -Path "target/$env:TARGET/release/multimeter.exe" `
            -Destination "dist/multimeter-$env:GITHUB_REF_NAME-$env:TARGET$env:ASSET_SUFFIX.exe"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          pattern: multimeter-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
