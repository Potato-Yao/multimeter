[package]
name = "multimeter"
version = "0.1.0"
edition = "2024"

[features]
default = ["static-dxc"]
static-dxc = ["wgpu/static-dxc"]

[dependencies]
base64 = "0.23"
battery = { package = "starship-battery", version = "0.12" }
bytemuck = "1"
futures-util = "0.3"
open = "5"
pollster = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["component", "disk", "network", "system"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = [
    "gles",
    "parking_lot",
    "std",
    "vulkan",
    "wgsl",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = [
    "dx12",
    "parking_lot",
    "std",
    "wgsl",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
